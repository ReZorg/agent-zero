<html>
<head>
  <title>A0 Ecosystem</title>
  <script type="module">
    import { store } from "/plugins/_ecosystem/webui/ecosystem-store.js";
  </script>
</head>

<body>
  <div x-data>
    <template x-if="$store.ecosystemStore">
      <div class="eco-shell" x-init="$store.ecosystemStore.onOpen()" x-destroy="$store.ecosystemStore.cleanup()">

        <!-- Hero -->
        <section class="eco-hero">
          <div class="eco-hero-copy">
            <div class="eco-eyebrow">Official ecosystem</div>
            <h2 class="eco-title">Agent Zero Ecosystem</h2>
            <p class="eco-desc">
              Official repos, integrations, tools, and templates from
              <a href="https://github.com/agent0ai" target="_blank" rel="noopener noreferrer">agent0ai</a>.
            </p>
          </div>
          <div class="eco-hero-count" x-show="!$store.ecosystemStore.loading && $store.ecosystemStore.catalog.length > 0">
            <span x-text="$store.ecosystemStore.catalog.length"></span>
            <span>items</span>
          </div>
        </section>

        <!-- Loading -->
        <div x-show="$store.ecosystemStore.loading" class="eco-state eco-state-loading">
          <span class="material-symbols-outlined eco-state-icon spinning">progress_activity</span>
          <span>Loading ecosystem…</span>
        </div>

        <!-- Error -->
        <div x-show="$store.ecosystemStore.error && !$store.ecosystemStore.loading"
             class="eco-state eco-state-error">
          <span class="material-symbols-outlined eco-state-icon">error</span>
          <span x-text="$store.ecosystemStore.error"></span>
          <button type="button" class="button" @click="$store.ecosystemStore.fetchCatalog()">Retry</button>
        </div>

        <!-- Content -->
        <template x-if="!$store.ecosystemStore.loading && !$store.ecosystemStore.error">
          <div>

            <!-- Filter chips -->
            <div class="eco-filter-row" x-show="$store.ecosystemStore.filterOptions.length > 1">
              <template x-for="f in $store.ecosystemStore.filterOptions" :key="f.key">
                <button
                  type="button"
                  class="eco-filter-chip"
                  :class="{ active: $store.ecosystemStore.filter === f.key }"
                  @click="$store.ecosystemStore.filter = f.key"
                >
                  <span x-text="f.label"></span>
                  <span class="eco-filter-count" x-text="f.count"></span>
                </button>
              </template>
            </div>

            <!-- Card grid -->
            <div class="eco-grid" x-show="$store.ecosystemStore.filteredCatalog.length > 0">
              <template x-for="entry in $store.ecosystemStore.filteredCatalog" :key="entry.id">
                <div class="eco-card">

                  <div class="eco-card-header">
                    <div class="eco-card-title-row">
                      <h3 class="eco-card-title" x-text="entry.title"></h3>
                      <span class="eco-type-badge"
                            :class="'eco-type-' + entry.type"
                            x-text="entry.type">
                      </span>
                    </div>
                    <div class="eco-card-subtitle" x-text="entry.subtitle"></div>
                  </div>

                  <p class="eco-card-desc" x-text="entry.description"></p>

                  <div class="eco-card-actions">
                    <template x-for="action in entry.actions" :key="action.label">
                      <button
                        type="button"
                        class="button eco-action-btn"
                        :class="{ 'eco-action-copied': $store.ecosystemStore.isCopied(entry, action) }"
                        @click="$store.ecosystemStore.handleAction(action, entry)"
                        :title="action.type === 'copy_text' ? action.text : action.label"
                      >
                        <span class="material-symbols-outlined eco-action-icon"
                              x-text="$store.ecosystemStore.isCopied(entry, action)
                                ? 'check'
                                : $store.ecosystemStore.getActionIcon(action.type)">
                        </span>
                        <span x-text="$store.ecosystemStore.isCopied(entry, action) ? 'Copied!' : action.label"></span>
                      </button>
                    </template>
                  </div>

                </div>
              </template>
            </div>

            <!-- Empty state -->
            <div x-show="$store.ecosystemStore.filteredCatalog.length === 0"
                 class="eco-state eco-state-empty">
              <span class="material-symbols-outlined eco-state-icon">search_off</span>
              <span>No entries match this filter.</span>
            </div>

          </div>
        </template>

      </div>
    </template>
  </div>

  <style>
    /* ── Shell ──────────────────────────────── */
    .eco-shell {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      font-family: "Rubik", Arial, Helvetica, sans-serif;
    }

    .eco-shell button,
    .eco-shell input,
    .eco-shell select {
      font-family: inherit;
    }

    /* ── Hero ───────────────────────────────── */
    .eco-hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.15rem 0 0.3rem;
    }

    .eco-eyebrow {
      margin-bottom: 0.35rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-highlight, #7b8fff);
    }

    .eco-title {
      margin: 0 0 0.35rem;
      font-size: 1.5rem;
      line-height: 1.15;
      color: var(--color-text-primary);
    }

    .eco-desc {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--color-text-secondary);
    }

    .eco-desc a {
      color: var(--color-highlight, #7b8fff);
      text-decoration: none;
    }

    .eco-desc a:hover {
      text-decoration: underline;
    }

    .eco-hero-count {
      flex-shrink: 0;
      padding: 0.5rem 0.8rem;
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      background: var(--color-panel);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-text-primary);
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }

    /* ── Filter chips ───────────────────────── */
    .eco-filter-row {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .eco-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.6rem;
      border: 1px solid var(--color-border);
      border-radius: 1rem;
      background: transparent;
      color: var(--color-text-secondary);
      font-size: 0.82rem;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    .eco-filter-chip:hover {
      background: var(--color-hover, rgba(255,255,255,0.06));
      color: var(--color-text-primary);
    }

    .eco-filter-chip.active {
      background: var(--color-highlight, #7b8fff);
      border-color: var(--color-highlight, #7b8fff);
      color: #fff;
    }

    .eco-filter-count {
      opacity: 0.75;
      font-size: 0.75rem;
    }

    /* ── Card grid ──────────────────────────── */
    .eco-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.85rem;
    }

    .eco-card {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 0.9rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: 0.6rem;
      background: var(--color-panel);
      transition: border-color 0.15s;
    }

    .eco-card:hover {
      border-color: var(--color-highlight, #7b8fff);
    }

    /* ── Card header ────────────────────────── */
    .eco-card-title-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .eco-card-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .eco-card-subtitle {
      font-size: 0.78rem;
      color: var(--color-text-secondary);
      margin-top: 0.1rem;
    }

    /* ── Type badge ─────────────────────────── */
    .eco-type-badge {
      flex-shrink: 0;
      padding: 0.1rem 0.5rem;
      border-radius: 0.75rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid transparent;
    }

    .eco-type-product     { background: rgba(100, 149, 237, 0.18); color: #4a90e2; border-color: rgba(100,149,237,0.35); }
    .eco-type-integration { background: rgba(80, 200, 120, 0.18);  color: #3aaa6a; border-color: rgba(80,200,120,0.35); }
    .eco-type-template    { background: rgba(180, 100, 220, 0.18); color: #a050d0; border-color: rgba(180,100,220,0.35); }
    .eco-type-install     { background: rgba(240, 160, 50, 0.18);  color: #d08020; border-color: rgba(240,160,50,0.35); }
    .eco-type-benchmark   { background: rgba(240, 200, 50, 0.18);  color: #a08010; border-color: rgba(240,200,50,0.35); }
    .eco-type-example     { background: rgba(150, 150, 150, 0.18); color: #888;    border-color: rgba(150,150,150,0.35); }

    /* ── Card body ──────────────────────────── */
    .eco-card-desc {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--color-text-secondary);
      flex: 1;
    }

    /* ── Actions ────────────────────────────── */
    .eco-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.2rem;
    }

    .eco-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
    }

    .eco-action-icon {
      font-size: 0.95rem;
    }

    .eco-action-copied {
      background: rgba(80, 200, 120, 0.18) !important;
      border-color: #3aaa6a !important;
      color: #3aaa6a !important;
    }

    /* ── States ─────────────────────────────── */
    .eco-state {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 2rem;
      justify-content: center;
      font-size: 0.95rem;
      color: var(--color-text-secondary);
    }

    .eco-state-error {
      color: var(--color-error, #e74c3c);
      flex-direction: column;
    }

    .eco-state-icon {
      font-size: 1.5rem;
    }

    /* ── Spinner ────────────────────────────── */
    @keyframes eco-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .spinning {
      animation: eco-spin 1s linear infinite;
    }
  </style>
</body>
</html>
