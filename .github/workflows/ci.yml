name: CI

on:
  push:
    branches: [dev, main, testing, ready]
  pull_request:
    branches: [dev, main, testing, ready]

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Common system-dependency installation snippet (reused by multiple jobs)
# ---------------------------------------------------------------------------

jobs:
  # -------------------------------------------------------------------------
  # 1. Lint & Static Analysis
  # -------------------------------------------------------------------------
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.dev.txt

      - name: Install lint dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff – lint
        run: ruff check .

      - name: Ruff – format check
        run: ruff format --check .

      - name: mypy – type check core modules
        # Ignore missing stubs; focus on correctness of our own code
        run: |
          mypy --ignore-missing-imports \
               --no-error-summary \
               helpers/ api/ tools/ tests/ \
               || true   # informational only until all stubs are in place

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

  # -------------------------------------------------------------------------
  # 2. Security Scanning (informational – does not block merges)
  # -------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true   # informational; promote to blocking once triaged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.dev.txt

      - name: Install security tools
        run: |
          pip install --upgrade pip
          pip install "bandit[toml]" pip-audit

      - name: Bandit – Python security scan
        run: |
          bandit -r helpers/ api/ tools/ plugins/ -ll \
            --exit-zero \
            --format json -o bandit-report.json || true
          bandit -r helpers/ api/ tools/ plugins/ -ll --exit-zero

      - name: pip-audit – dependency CVE scan
        run: |
          pip-audit \
            --requirement requirements.txt \
            --requirement requirements2.txt \
            --skip-editable \
            --format json \
            -o pip-audit-report.json || true
          pip-audit \
            --requirement requirements.txt \
            --requirement requirements2.txt \
            --skip-editable || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # 3. Unit Tests (matrix: Python 3.11, 3.12, 3.13)
  # -------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements2.txt
            requirements.dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            poppler-utils \
            libmagic1 \
            ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements2.txt
          pip install -r requirements.dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/e2e \
            -v --tb=short \
            --cov=helpers \
            --cov=api \
            --cov=tools \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml \
            --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-3.12.xml

  # -------------------------------------------------------------------------
  # 4. E2E Tests (Python 3.12, Flask test client, mocked LLM)
  # -------------------------------------------------------------------------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements2.txt
            requirements.dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            poppler-utils \
            libmagic1 \
            ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements2.txt
          pip install -r requirements.dev.txt

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ \
            -m e2e \
            -v --tb=short

  # -------------------------------------------------------------------------
  # 5. Frontend Unit Tests (vitest)
  # -------------------------------------------------------------------------
  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # 6. Docker Build Smoke Test (PRs only)
  # -------------------------------------------------------------------------
  docker-smoke:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: DockerfileLocal
          push: false
          tags: agent-zero:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

